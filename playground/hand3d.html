<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mano 3D</title>
<style>
  :root { --bg: #101011; --panel: #16161a; --line: #2a2a30; --text: #f3efe4; --muted: #b4b4ba; --accent: #35e06a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 100vh; }
  #stage { width: 100%; height: 100vh; cursor: grab; touch-action: none; background: radial-gradient(circle at 50% 45%, #1d3a26 0%, var(--bg) 65%); }
  #stage:active { cursor: grabbing; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; color: var(--muted); border: 0; padding: 8px 4px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #0e1a10; font-weight: 600; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 13px; margin: 0 0 6px; }
  .check input { accent-color: var(--accent); }
  #view { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } #stage { height: 60vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <svg id="stage" viewBox="-450 -520 900 900" aria-label="Mano 3D">
    <g id="scene"></g>
  </svg>
  <aside>
    <div>
      <h1>Mano 3D</h1>
      <p class="hint">Arrastra sobre la mano: horizontal gira, vertical inclina. Flechas del teclado también.</p>
    </div>
    <div>
      <label>Juego de vistas</label>
      <div class="seg" id="set">
        <button data-v="hang" aria-pressed="true">Colgando</button>
        <button data-v="flat" aria-pressed="false">Acostada</button>
      </div>
    </div>
    <div>
      <label for="turn">Giro</label>
      <div class="row"><input id="turn" type="range" min="-180" max="180" step="15" value="0"><output id="turnOut">0°</output></div>
    </div>
    <div>
      <label>Inclinación</label>
      <div class="seg" id="tilt">
        <button data-v="30" aria-pressed="false">30°</button>
        <button data-v="0" aria-pressed="true">0°</button>
        <button data-v="-30" aria-pressed="false">−30°</button>
      </div>
    </div>
    <div>
      <label for="arm">Ángulo del antebrazo</label>
      <div class="row"><input id="arm" type="range" min="-180" max="180" step="1" value="0"><output id="armOut">0°</output></div>
    </div>
    <div>
      <label>Antebrazo</label>
      <div class="seg" id="forearm">
        <button data-v="3d" aria-pressed="true">3D (Turntable)</button>
        <button data-v="flat" aria-pressed="false">Plano (rig)</button>
      </div>
    </div>
    <div id="modeBox" hidden>
      <label>El antebrazo plano…</label>
      <div class="seg" id="mode">
        <button data-v="hand" aria-pressed="false">guía la mano</button>
        <button data-v="arm" aria-pressed="true">sigue la mano</button>
      </div>
      <p class="hint">"Sigue la mano": el antebrazo se alinea con la mano y se acorta cuando ella apunta a cámara.</p>
    </div>
    <div>
      <p class="check"><input id="showArm" type="checkbox" checked><label for="showArm" style="margin:0;color:inherit">Mostrar antebrazo</label></p>
      <p class="check"><input id="mirror" type="checkbox"><label for="mirror" style="margin:0;color:inherit">Espejar (mano izquierda)</label></p>
    </div>
    <div>
      <label>Animar el giro</label>
      <div class="seg" id="play">
        <button data-v="off" aria-pressed="true">Quieto</button>
        <button data-v="swing" aria-pressed="false">Vaivén</button>
        <button data-v="spin" aria-pressed="false">Vuelta</button>
      </div>
    </div>
    <div>
      <label for="speed">Velocidad</label>
      <div class="row"><input id="speed" type="range" min="15" max="360" step="15" value="90"><output id="speedOut">90°/s</output></div>
    </div>
    <div>Vista: <span id="view">0, 0</span></div>
  </aside>
</main>
<script src="hand3d.data.js"></script>
<script>
const D = window.HAND3D;
const $ = (id) => document.getElementById(id);
const state = { set: "hang", turn: 0, tilt: 0, arm: 0, forearm: "3d", mode: "arm", showArm: true, mirror: false, play: "off", speed: 90 };

// Longest wrist-to-fingertips distance in each set: the "not foreshortened" length.
const axisLen = (v) => Math.hypot(v.tips[0] - v.wrist[0], v.tips[1] - v.wrist[1]);
const maxAxis = Object.fromEntries(Object.entries(D.sets).map(([k, views]) => [k, Math.max(...Object.values(views).map(axisLen))]));
// Angle from straight down, degrees, positive toward +x; SVG rotate(θ) lowers it by θ.
const lean = (x, y) => (Math.atan2(x, y) * 180) / Math.PI;
const fa = D.forearm;
const forearmLean = lean(fa.wrist[0] - fa.elbow[0], fa.wrist[1] - fa.elbow[1]);

function render() {
  const key = `${state.turn},${state.tilt}`;
  const v = D.sets[state.set][key];
  if (!v) return;
  const flip = state.mirror ? -1 : 1;
  const s = D.handScale;
  $("modeBox").hidden = state.forearm === "3d";
  const f3 = D.forearm3d[state.set][key];
  if (state.forearm === "3d" && f3) {
    // Hand and forearm from the same Turntable camera: join the cuff to the
    // wrist and draw whichever is nearer the camera on top.
    const hand3 = `<g transform="translate(${-v.wrist[0]} ${-v.wrist[1]})">${v.markup}</g>`;
    const arm3 = state.showArm ? `<g transform="scale(${D.forearm3dScale}) translate(${-f3.cuff[0]} ${-f3.cuff[1]})">${f3.markup}</g>` : "";
    $("scene").innerHTML = `<g transform="translate(0 -60) rotate(${state.arm}) scale(${flip * s} ${s})">${f3.front ? hand3 + arm3 : arm3 + hand3}</g>`;
    $("view").textContent = `mano ${state.turn}, ${state.tilt} · antebrazo ${f3.turn}, ${state.tilt}`;
    $("turn").value = state.turn;
    $("turnOut").textContent = `${state.turn}°`;
    $("armOut").textContent = `${state.arm}°`;
    return;
  }
  // Hand axis (wrist → fingertips) after mirroring.
  const ax = [(v.tips[0] - v.wrist[0]) * flip, v.tips[1] - v.wrist[1]];
  const handLean = lean(ax[0], ax[1]);
  let handRot, armRot, armScale;
  if (state.mode === "hand") {
    // The rig's way: the hand turns to lie along the forearm.
    handRot = state.arm + handLean;
    armRot = state.arm;
    armScale = 1;
  } else {
    // The forearm lies along the hand and shortens as the hand points at the camera.
    handRot = state.arm;
    armRot = state.arm - handLean;
    armScale = Math.max(0.3, axisLen(v) / maxAxis[state.set]);
  }
  const forearm = state.showArm
    ? `<g transform="rotate(${armRot}) scale(1 ${armScale}) rotate(${forearmLean}) translate(${-fa.wrist[0]} ${-fa.wrist[1]})">${fa.markup}</g>`
    : "";
  const hand = `<g transform="rotate(${handRot}) scale(${flip * s} ${s}) translate(${-v.wrist[0]} ${-v.wrist[1]})">${v.markup}</g>`;
  // Forearm first so the hand overlaps the cuff.
  $("scene").innerHTML = `<g transform="translate(0 -60)">${forearm}${hand}</g>`;
  $("view").textContent = `${state.turn}, ${state.tilt}`;
  $("turn").value = state.turn;
  $("turnOut").textContent = `${state.turn}°`;
  $("armOut").textContent = `${state.arm}°`;
}

const wrap = (t) => ((((t + 180) % 360) + 360) % 360) - 180;
const snap = (t) => Math.round(t / 15) * 15;

function segmented(id, key, parse = (x) => x) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    for (const x of $(id).querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
    state[key] = parse(b.dataset.v);
    if (key === "play") startTime = performance.now();
    render();
  });
}
const setPressed = (id, value) => {
  for (const x of $(id).querySelectorAll("button")) x.setAttribute("aria-pressed", x.dataset.v === String(value));
};

segmented("set", "set");
segmented("tilt", "tilt", Number);
segmented("mode", "mode");
segmented("forearm", "forearm");
segmented("play", "play");
$("turn").addEventListener("input", (e) => { state.turn = Number(e.target.value); render(); });
$("arm").addEventListener("input", (e) => { state.arm = Number(e.target.value); render(); });
$("showArm").addEventListener("change", (e) => { state.showArm = e.target.checked; render(); });
$("mirror").addEventListener("change", (e) => { state.mirror = e.target.checked; render(); });
$("speed").addEventListener("input", (e) => { state.speed = Number(e.target.value); $("speedOut").textContent = `${state.speed}°/s`; });

// Drag: horizontal turns (15° per 20px), vertical tilts.
let drag = null;
$("stage").addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, turn: state.turn, tilt: state.tilt }; $("stage").setPointerCapture(e.pointerId); });
$("stage").addEventListener("pointermove", (e) => {
  if (!drag) return;
  state.turn = wrap(snap(drag.turn + ((e.clientX - drag.x) / 20) * 15));
  const dy = e.clientY - drag.y;
  state.tilt = Math.max(-30, Math.min(30, drag.tilt + (dy < -40 ? 30 : dy > 40 ? -30 : 0)));
  setPressed("tilt", state.tilt);
  render();
});
$("stage").addEventListener("pointerup", () => (drag = null));
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") state.turn = wrap(state.turn - 15);
  else if (e.key === "ArrowRight") state.turn = wrap(state.turn + 15);
  else if (e.key === "ArrowUp") state.tilt = Math.min(30, state.tilt + 30);
  else if (e.key === "ArrowDown") state.tilt = Math.max(-30, state.tilt - 30);
  else return;
  setPressed("tilt", state.tilt);
  render();
});

// Playback steps through the real views (15° apart) at the chosen speed.
let startTime = performance.now();
function tick(now) {
  if (state.play !== "off") {
    const deg = ((now - startTime) / 1000) * state.speed;
    const t = state.play === "spin" ? wrap(deg) : 90 * Math.sin((deg * Math.PI) / 180);
    const next = snap(t);
    if (next !== state.turn) { state.turn = wrap(next); render(); }
  }
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
